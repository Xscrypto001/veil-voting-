[package]
name = "veil-vote"
version = "0.1.0"
edition = "2021"

[dependencies]
stylus-sdk = "0.5.2"
alloy-primitives = "0.7.6"
alloy-sol-types = "0.7.6"
ruint = "=1.12.3"  # Add this explicitly

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"

[lib]
crate-type = ["cdylib"]


